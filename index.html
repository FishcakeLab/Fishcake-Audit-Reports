<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fishcake Audit Access</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 20vh;
      background-color: #f8fafc;
      color: #1d3557;
    }
    input {
      padding: 10px;
      width: 220px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      margin-left: 5px;
      background-color: #1d3557;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #457b9d;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      color: #0077cc;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>🔒 Fishcake Audit Report Access</h2>
  <p>Enter password to view the report:</p>
  <input type="password" id="pwd" placeholder="Enter password">
  <button onclick="verify()">Access</button>
  <p id="msg" style="color:red;"></p>

  <div id="link" style="display:none;">
    <p>✅ Access granted. Click below to preview:</p>
    <a href="#" onclick="openPDF()">📄 View Audit Report (Preview Only)</a>
    <div id="pdf" style="margin-top:20px;"></div>
  </div>

  <script>
    const correct = "RmlzaGNha2VBdWRpdDIwMjUh"; 
    const pdf = "https://github.com/FishcakeLab/Fishcake-Audit-Reports/blob/main/2025-09_Audit%20_Report_Secure3.pdf";

    function verify() {
      const input = document.getElementById("pwd").value.trim();
      if (btoa(input) === correct) {
        document.getElementById("link").style.display = "block";
        document.getElementById("msg").textContent = "";
      } else {
        document.getElementById("msg").textContent = "❌ Incorrect password.";
      }
    }

    function openPDF() {
      const pdfBox = document.getElementById("pdf");
      pdfBox.innerHTML = `<iframe src="${pdf}" width="90%" height="600px" style="border:none;"></iframe>`;
    }
  </script>
</body>
</html>
