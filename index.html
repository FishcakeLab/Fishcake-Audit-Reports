<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fishcake Audit Access</title>
  <style>
    body {
      font-family: "Inter", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1d3557;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 20vh;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 250px;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #1d3557;
      color: white;
      border: none;
      border-radius: 4px;
      margin-left: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #457b9d;
    }
    h1 {
      color: #1d3557;
    }
    h2 {
      color: red;
    }
    iframe {
      width: 90%;
      height: 80vh;
      border: none;
      margin-top: 20px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #0077cc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container" id="login">
    <h1>🔒 Fishcake Audit Access</h1>
    <p>Please enter the access password to view the confidential audit report.</p>
    <input type="password" id="pwd" placeholder="Enter password" />
    <button onclick="verify()">Access</button>
    <p id="message" style="color:red;margin-top:10px;"></p>
  </div>

  <div id="content" style="display:none;">
    <h1>Welcome to Fishcake Audit Reports 🍥🐟</h1>
    <p>Authorized users only. Confidential content.</p>
    <a href="https://github.com/FishcakeLab/Fishcake-Audit-Reports/blob/main/2025-09_Audit%20_Report_Secure3.pdf" target="_blank">
      📄 Click here to open the Audit Report (PDF)
    </a>
    <br><br>
    <iframe src="https://github.com/FishcakeLab/Fishcake-Audit-Reports/raw/main/2025-09_Audit%20_Report_Secure3.pdf"></iframe>
  </div>

  <script>
    function verify() {
      const input = document.getElementById("pwd").value;
      const encoded = btoa(input);
      const correct = "ZmlzaGNhY2VBdWRpdDIwMjUh"; // Base64 of "fxxxxAxxx2025!"
      if (encoded === correct) {
        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "block";
      } else {
        document.getElementById("message").innerText = "❌ Incorrect password, please try again.";
      }
    }
  </script>
</body>
</html>
